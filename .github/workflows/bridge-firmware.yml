name: Bridge and firmware checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bridge regression tests
        run: python -m unittest discover -s cc-island-c3/pc_bridge/tests -v

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32-C3 firmware
        working-directory: cc-island-c3
        run: |
          cp src/wifi_secrets.example.h src/wifi_secrets.h
          pio run -e esp32-c3-supermini
      - name: Run host-side firmware logic tests
        working-directory: cc-island-c3
        run: pio test -e native
